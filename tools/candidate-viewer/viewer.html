 m[0]=(1-2*(y*y+z*z))*s[0];m[1]=(2*(x*y+z*w))*s[0];m[2]=(2*(x*z-y*w))*s[0];m[4]=(2*(x*y-z*w))*s[1];m[5]=(1-2*(x*x+z*z))*s[1];m[6]=(2*(y*z+x*w))*s[1];m[8]=(2*(x*z+y*w))*s[2];m[9]=(2*(y*z-x*w))*s[2];m[10]=(1-2*(x*x+y*y))*s[2];m[12]=t[0];m[13]=t[1];m[14]=t[2];m[15]=1;return m;}

const vs=`#version 300 es

(async()=>{

 const texCache={};const texFor=async i=>{if(i===undefined)return null;if(texCache[i])return texCache[i];const im=j.images[j.textures[i].source];const bv=j.bufferViews[im.bufferView];const blob=new Blob([bin.slice((bv.byteOffset||0),(bv.byteOffset||0)+bv.byteLength)],{type:im.mimeType});const bmp=await createImageBitmap(blob,{imageOrientation:'none',premultiplyAlpha:'none'});const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bmp);gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);const ae=gl.getExtension('EXT_texture_filter_anisotropic');if(ae)gl.texParameterf(gl.TEXTURE_2D,ae.TEXTURE_MAX_ANISOTROPY_EXT,8);return texCache[i]=t;};
 const matInfo=m=>{const pb=m.pbrMetallicRoughness||{};let bc=(pb.baseColorFactor||[1,1,1,1]).slice(0,3).map(v=>v);

 // texture avg colours for flat-colour textures (glb embedded) provided by python via TEXCOL json

   const mt=matInfo(j.materials[pm.material??0]);
   let UV=pm.attributes.TEXCOORD_0!==undefined?acc(j,bin,pm.attributes.TEXCOORD_0):null;let U2=new Float32Array((P2.length/3)*2);if(UV){if(idx){for(let k=0;k<idx.length;k++){const v=idx[k];U2[k*2]=UV[v*2];U2[k*2+1]=UV[v*2+1];}}else U2=UV;}
   const nm=new Float32Array([Wm[0],Wm[1],Wm[2],Wm[4],Wm[5],Wm[6],Wm[8],Wm[9],Wm[10]]);
   draws.push({P:P2,N:N2,UV:U2,cnt:P2.length/3,M:Float32Array.from(Wm),NM:nm,mt,name:n.name||''});}
   (n.children||[]).forEach(c=>walk(c,Wm));};
 j.scenes[j.scene||0].nodes.forEach(r=>walk(r,I4));
 for(const d of draws){d.tx=await texFor(d.mt.tex);d.mr=await texFor(d.mt.mrt);}
 for(const d of draws){gl.bindVertexArray(d.vao=gl.createVertexArray());mkbuf(d.P,'p',3);mkbuf(d.N,'n',3);mkbuf(d.UV,'uv',2);}

 let fovD=58,eye,tgt;
 if(VIEW=='chase'){eye=[0,2.3,-6.9];tgt=[0,1.15,3.5];fovD=58;}
 else if(VIEW=='chase_fast'){eye=[0,2.7,-8.4];tgt=[0,1.15,6.7];fovD=73;}
 else if(VIEW=='rear34'){eye=[-3.3,1.5,-5.2];tgt=[0,.6,0];fovD=40;}
 else if(VIEW=='side'){eye=[8,1.0,0];tgt=[0,.6,0];fovD=34;}
 else if(VIEW=='top'){eye=[0,9,-.01];tgt=[0,0,0];fovD=36;}
 else if(VIEW=='front34'){eye=[3.5,1.3,5];tgt=[0,.6,0];fovD=40;}
 const Pm=persp(fovD*Math.PI/180,W/H,.3,200),Vm=look(eye,tgt,[0,1,0]),VP=Float32Array.from(mm(Pm,Vm));
 gl.viewport(0,0,W,H);gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
 gl.clearColor(...[1.0,.52,.30].map(v=>Math.pow(v*.9,1/2.2)),1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.uniformMatrix4fv(U('VP'),false,VP);gl.uniform3f(U('cam'),...eye);
 const sd=[.45,.22,.86],sl=Math.hypot(...sd);gl.uniform3f(U('sunDir'),sd[0]/sl,sd[1]/sl,sd[2]/sl);

   if(d.tx&&nmn=='paint'&&Q.get('paint'))d.tx=null;gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,d.tx||null);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,d.mr||null);gl.uniform1i(U('tex'),0);gl.uniform1i(U('mrt'),1);gl.uniform1f(U('hasTex'),d.tx?1:0);gl.uniform1f(U('hasMR'),d.mr?1:0);gl.uniform3f(U('base0'),...col);gl.uniform1f(U('metal0'),d.mt.metal);gl.uniform1f(U('rough0'),d.mt.rough);gl.uniform1f(U('alpha'),d.mt.alpha);gl.uniform1f(U('coat'),d.mt.coat);gl.uniform1f(U('emis'),d.mt.emis);gl.uniform3f(U('emisCol'),...(d.mt.emisCol||[0,0,0]));gl.drawArrays(gl.TRIANGLES,0,d.cnt);};
 // ground (asphalt) as a big quad

 const sv=gl.createVertexArray();gl.bindVertexArray(sv);mkbuf(sq,'p',3);mkbuf(gn,'n',3);mkbuf(new Float32Array(12),'uv',2);
 drawOne({vao:sv,cnt:6,mt:{name:'sh',col:[0,0,0],metal:0,rough:1,alpha:.55,coat:0,emis:0}},Float32Array.from(I4),new Float32Array([1,0,0,0,1,0,0,0,1]));
 const opaque=draws.filter(d=>d.mt.alpha>=.99),trans=draws.filter(d=>d.mt.alpha<.99);
 const m3=(a,b)=>{const o=new Float32Array(9);for(let r=0;r<3;r++)for(let c=0;c<3;c++){let t=0;for(let k=0;k<3;k++)t+=a[k*3+r]*b[c*3+k];o[c*3+r]=t;}return o;};

})().catch(e=>{document.title='ERR '+e;window.ERR=String(e)});
